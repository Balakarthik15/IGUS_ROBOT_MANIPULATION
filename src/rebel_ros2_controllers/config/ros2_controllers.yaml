controller_manager:
  ros__parameters:
    update_rate: 100 #Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
  

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.01   # rad/s — "close enough to stopped"
      goal_time: 0.0                     # 0 = no overall time limit enforced

      # Per-joint goal tolerance (radians) — arm must be within this at goal
      joint1: { goal: 0.01 }
      joint2: { goal: 0.01 }
      joint3: { goal: 0.01 }
      joint4: { goal: 0.01 }
      joint5: { goal: 0.01 }
      joint6: { goal: 0.01 }
